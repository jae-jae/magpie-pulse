name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Bump version and create draft release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          cur="$(jq -r .version mygo.json)"
          next="$cur"

          if git rev-parse "v${cur}" >/dev/null 2>&1 || gh release view "v${cur}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IFS='.' read -r major minor patch <<< "$cur"
            patch="${patch%%-*}"
            while :; do
              patch=$((patch + 1))
              candidate="${major}.${minor}.${patch}"
              if ! git rev-parse "v${candidate}" >/dev/null 2>&1 && ! gh release view "v${candidate}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                next="$candidate"
                break
              fi
            done

            jq --arg v "$next" '.version = $v' mygo.json > mygo.json.tmp
            mv mygo.json.tmp mygo.json

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mygo.json
            git commit -m "chore(release): v${next} [skip ci]"
            git push origin HEAD:main
          fi

          tag="v${next}"
          git tag "$tag"
          git push origin "$tag"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$tag" --generate-notes
          fi

          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test and vet
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./...
          go tool mygo vet .

      - name: Build and upload signed release artifacts
        env:
          CGO_ENABLED: "0"
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          go tool mygo build -platform "darwin/arm64,darwin/amd64" -upload

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
